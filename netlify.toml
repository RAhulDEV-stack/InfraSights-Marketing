# ==============================================================================
# Infrasights v2.10 — Netlify Production Configuration
# Custom Domain: infrasights.in / www.infrasights.in
# ==============================================================================

[build]
  # Publish directory containing index.html, assets, css, js, sitemap.xml, robots.txt
  publish = "."
  # Netlify Serverless Functions directory
  functions = "netlify/functions"
  # Lightweight verification build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ==============================================================================
# Global Security & Transport Headers
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Robots-Tag = "all"

# Edge Performance & Canonical Link: Landing Page
[[headers]]
  for = "/"
  [headers.values]
    Link = '<https://infrasights.in/>; rel="canonical", <https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect; crossorigin'
    X-Robots-Tag = "all, index, follow"

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '<https://infrasights.in/>; rel="canonical"'
    X-Robots-Tag = "all, index, follow"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon Caching
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Never cache HTML to ensure instant updates on deployment
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "all, index, follow"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "all, index, follow"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Disallow indexing on internal API endpoints and vendor admin routes
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/vendor"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ==============================================================================
# Block Direct Access to Sensitive Server Code
# ==============================================================================
[[redirects]]
  from = "/server/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404

# ==============================================================================
# Domain Canonicalization (Redirect www to apex domain infrasights.in)
# ==============================================================================
[[redirects]]
  from = "https://www.infrasights.in/*"
  to = "https://infrasights.in/:splat"
  status = 301
  force = true

# ==============================================================================
# Netlify Serverless Functions API Routing
# Directs /api/* requests directly to the serverless function handler
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ==============================================================================
# SPA Routing Fallback
# Serves index.html for all non-asset client routes
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
